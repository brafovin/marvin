<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 20px;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #4ade80;
      text-shadow: 0 0 20px #4ade8066;
    }

    #scoreboard {
      display: flex;
      gap: 40px;
      font-size: 1rem;
      letter-spacing: 2px;
    }

    #scoreboard span {
      color: #888;
    }

    #scoreboard strong {
      color: #4ade80;
      font-size: 1.2rem;
    }

    #game-container {
      position: relative;
    }

    canvas {
      border: 2px solid #4ade8044;
      border-radius: 4px;
      box-shadow: 0 0 40px #4ade8022, inset 0 0 40px #00000066;
      display: block;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 15, 0.85);
      border-radius: 2px;
      gap: 16px;
    }

    #overlay h2 {
      font-size: 1.8rem;
      letter-spacing: 4px;
      color: #4ade80;
    }

    #overlay p {
      color: #888;
      letter-spacing: 1px;
      font-size: 0.9rem;
    }

    #overlay .final-score {
      font-size: 1.1rem;
      color: #e0e0e0;
      letter-spacing: 2px;
    }

    button {
      margin-top: 8px;
      padding: 12px 32px;
      background: transparent;
      border: 2px solid #4ade80;
      color: #4ade80;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
    }

    button:hover {
      background: #4ade8022;
      box-shadow: 0 0 20px #4ade8044;
    }

    #controls {
      color: #555;
      font-size: 0.78rem;
      letter-spacing: 2px;
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>

  <div id="scoreboard">
    <div><span>SCORE </span><strong id="score">0</strong></div>
    <div><span>HIGHSCORE </span><strong id="highscore">0</strong></div>
    <div><span>LEVEL </span><strong id="level">1</strong></div>
  </div>

  <div id="game-container">
    <canvas id="canvas" width="500" height="500"></canvas>
    <div id="overlay">
      <h2>SNAKE</h2>
      <p>Friss die Äpfel, meide dich selbst</p>
      <button id="start-btn">STARTEN</button>
    </div>
  </div>

  <div id="controls">
    WASD / PFEILTASTEN &nbsp;·&nbsp; PAUSE: P &nbsp;·&nbsp; NEU: R
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const scoreEl = document.getElementById('score');
    const highscoreEl = document.getElementById('highscore');
    const levelEl = document.getElementById('level');
    const startBtn = document.getElementById('start-btn');

    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;

    let snake, dir, nextDir, food, score, highscore, level, gameLoop, paused, alive;

    highscore = parseInt(localStorage.getItem('snake-hs') || '0');
    highscoreEl.textContent = highscore;

    function randomCell(exclude = []) {
      let cell;
      do {
        cell = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
      } while (exclude.some(e => e.x === cell.x && e.y === cell.y));
      return cell;
    }

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9,  y: 10 },
        { x: 8,  y: 10 },
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      food = randomCell(snake);
      score = 0;
      level = 1;
      paused = false;
      alive = true;
      scoreEl.textContent = 0;
      levelEl.textContent = 1;
    }

    function speed() {
      return Math.max(60, 180 - (level - 1) * 15);
    }

    function step() {
      if (paused || !alive) return;

      dir = nextDir;

      const head = {
        x: (snake[0].x + dir.x + COLS) % COLS,
        y: (snake[0].y + dir.y + ROWS) % ROWS,
      };

      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += level * 10;
        scoreEl.textContent = score;
        if (score > highscore) {
          highscore = score;
          highscoreEl.textContent = highscore;
          localStorage.setItem('snake-hs', highscore);
        }
        level = Math.floor(score / 100) + 1;
        levelEl.textContent = level;
        food = randomCell(snake);
        restartLoop();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid dots
      ctx.fillStyle = '#1a1a2a';
      for (let x = 0; x < COLS; x++) {
        for (let y = 0; y < ROWS; y++) {
          ctx.fillRect(x * GRID + GRID / 2 - 1, y * GRID + GRID / 2 - 1, 2, 2);
        }
      }

      // Food
      const fx = food.x * GRID + GRID / 2;
      const fy = food.y * GRID + GRID / 2;
      ctx.save();
      ctx.shadowColor = '#f87171';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#f87171';
      ctx.beginPath();
      ctx.arc(fx, fy, GRID / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Snake
      snake.forEach((seg, i) => {
        const ratio = 1 - i / snake.length;
        const alpha = 0.4 + ratio * 0.6;
        ctx.save();
        ctx.shadowColor = `rgba(74, 222, 128, ${ratio * 0.5})`;
        ctx.shadowBlur = ratio * 10;
        ctx.fillStyle = `rgba(74, 222, 128, ${alpha})`;
        const pad = i === 0 ? 1 : 2;
        ctx.beginPath();
        ctx.roundRect(
          seg.x * GRID + pad,
          seg.y * GRID + pad,
          GRID - pad * 2,
          GRID - pad * 2,
          i === 0 ? 4 : 3
        );
        ctx.fill();
        ctx.restore();
      });

      // Eyes on head
      const h = snake[0];
      ctx.fillStyle = '#0a0a0f';
      const eyeOffset = dir.y !== 0
        ? [{ x: -4, y: dir.y * 3 }, { x: 4, y: dir.y * 3 }]
        : [{ x: dir.x * 3, y: -4 }, { x: dir.x * 3, y: 4 }];
      eyeOffset.forEach(e => {
        ctx.beginPath();
        ctx.arc(h.x * GRID + GRID / 2 + e.x, h.y * GRID + GRID / 2 + e.y, 2, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function gameOver() {
      alive = false;
      clearInterval(gameLoop);

      overlay.innerHTML = `
        <h2>GAME OVER</h2>
        <p class="final-score">PUNKTE: ${score}</p>
        ${score >= highscore && score > 0 ? '<p style="color:#fbbf24;letter-spacing:2px">NEUER HIGHSCORE!</p>' : ''}
        <button id="start-btn">NOCHMAL</button>
      `;
      overlay.style.display = 'flex';
      document.getElementById('start-btn').addEventListener('click', startGame);
    }

    function restartLoop() {
      clearInterval(gameLoop);
      gameLoop = setInterval(step, speed());
    }

    function startGame() {
      overlay.style.display = 'none';
      init();
      restartLoop();
      draw();
    }

    document.addEventListener('keydown', e => {
      const map = {
        ArrowUp:    { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
        ArrowDown:  { x: 0, y:  1 }, s: { x: 0, y:  1 }, S: { x: 0, y:  1 },
        ArrowLeft:  { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
        ArrowRight: { x: 1, y:  0 }, d: { x: 1,  y: 0 }, D: { x: 1,  y: 0 },
      };
      const d = map[e.key];
      if (d && alive) {
        if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
        e.preventDefault();
      }
      if ((e.key === 'p' || e.key === 'P') && alive) {
        paused = !paused;
        if (!paused) draw();
      }
      if (e.key === 'r' || e.key === 'R') {
        clearInterval(gameLoop);
        startGame();
      }
    });

    startBtn.addEventListener('click', startGame);

    draw();
  </script>
</body>
</html>
