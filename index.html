<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Stickman Schwert-Kampf</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0d0d1a;overflow:hidden;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100vw;max-height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=900,H=520;
canvas.width=W;canvas.height=H;

// ──────────────────────────────────────
// PLATFORMS
// ──────────────────────────────────────
const PLATS=[
  {x:0,   y:440,w:W,  h:80}, // ground
  {x:120, y:315,w:160,h:16}, // left
  {x:620, y:315,w:160,h:16}, // right
  {x:365, y:210,w:170,h:16}, // center top
];

// ──────────────────────────────────────
// PARTICLES
// ──────────────────────────────────────
const ptcls=[];
function burst(x,y,color,n,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const s=1+Math.random()*spd;
    ptcls.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,
      life:1,decay:.03+Math.random()*.04,
      color,sz:2+Math.random()*5});
  }
}
function sparkBurst(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const s=3+Math.random()*6;
    ptcls.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:1,decay:.08+Math.random()*.08,
      color:'#ffee44',sz:2+Math.random()*3});
  }
}

// ──────────────────────────────────────
// PLAYER CLASS
// ──────────────────────────────────────
class Fighter{
  constructor(x,color,dir,ctrl,label){
    this.sx=x;this.sy=370;
    this.x=x;this.y=370;
    this.vx=0;this.vy=0;
    this.dir=dir;
    this.color=color;
    this.label=label;
    this.hp=100;this.maxHp=100;
    this.wins=0;
    this.onGround=false;
    this.extraJumps=0;
    this.ctrl=ctrl;
    // attack
    this.atkTimer=0;    // ms remaining in current swing
    this.atkDur=350;
    this.atkCd=0;       // cooldown after swing
    this.hitDone=false; // one hit per swing
    // state
    this.dead=false;
    this.deathT=0;
    this.invT=0;        // invincibility
    this.flashT=0;
    this.jumpHeld=false;
  }

  // Sword angle relative to hand: sweeps from high to low
  get swingFrac(){return this.atkTimer>0?1-this.atkTimer/this.atkDur:0;}
  get swordAngle(){
    if(this.atkTimer>0){
      return(-1.15+this.swingFrac*2.3)*this.dir;
    }
    return(this.dir>0?-0.45:Math.PI+0.45);
  }
  get handX(){return this.x+this.dir*5;}
  get handY(){return this.y-24;}
  get tipX(){return this.handX+Math.cos(this.swordAngle)*50;}
  get tipY(){return this.handY+Math.sin(this.swordAngle)*50;}

  reset(){
    this.x=this.sx;this.y=this.sy;
    this.vx=0;this.vy=0;
    this.hp=100;this.atkTimer=0;this.atkCd=0;
    this.onGround=false;this.extraJumps=0;
    this.dead=false;this.deathT=0;
    this.invT=0;this.flashT=0;
    this.hitDone=false;this.jumpHeld=false;
  }

  update(dt,keys){
    if(this.dead){this.deathT+=dt;return;}
    const c=this.ctrl;
    const spd=190;

    // Horizontal
    this.vx=0;
    if(keys[c.left])this.vx=-spd;
    if(keys[c.right])this.vx=spd;
    if(this.vx!==0)this.dir=this.vx>0?1:-1;

    // Jump (rising edge)
    const wantJump=keys[c.jump];
    if(wantJump&&!this.jumpHeld){
      if(this.onGround){this.vy=-570;this.onGround=false;}
      else if(this.extraJumps<1){this.vy=-490;this.extraJumps++;}
    }
    this.jumpHeld=wantJump;

    // Attack
    if(keys[c.attack]&&this.atkTimer<=0&&this.atkCd<=0){
      this.atkTimer=this.atkDur;this.hitDone=false;
    }
    if(this.atkTimer>0)this.atkTimer=Math.max(0,this.atkTimer-dt*1000);
    if(this.atkCd>0)this.atkCd=Math.max(0,this.atkCd-dt*1000);

    // Gravity
    this.vy+=1350*dt;
    if(this.vy>900)this.vy=900;

    // Move & collide
    this.x+=this.vx*dt;
    this.y+=this.vy*dt;

    this.onGround=false;
    for(const p of PLATS){
      // Vertical collision (falling onto platform)
      if(this.x>p.x+8&&this.x<p.x+p.w-8){
        const prev=this.y-this.vy*dt;
        if(this.y>=p.y&&prev<=p.y+2){
          this.y=p.y;this.vy=0;this.onGround=true;this.extraJumps=0;
        }
        // Head bump
        if(this.y-55<=p.y+p.h&&(this.y-55)-this.vy*dt>=p.y&&this.vy<0){
          this.y=p.y+p.h+55;this.vy=0;
        }
      }
    }

    // Bounds
    this.x=Math.max(12,Math.min(W-12,this.x));

    // Fell into void
    if(this.y>H+80){this.die(false);}

    if(this.invT>0)this.invT-=dt*1000;
    if(this.flashT>0)this.flashT-=dt*1000;
  }

  tryHit(other){
    if(this.atkTimer<=0||this.hitDone)return;
    if(this.atkTimer>this.atkDur*0.88)return; // windup
    // Sword tip vs opponent AABB
    const tx=this.tipX,ty=this.tipY;
    const ox=other.x,oy=other.y;
    const cx2=Math.max(ox-14,Math.min(ox+14,tx));
    const cy2=Math.max(oy-55,Math.min(oy+2,ty));
    const dd=(tx-cx2)**2+(ty-cy2)**2;
    if(dd<14*14){
      this.hitDone=true;
      this.atkCd=250;
      const kDir=other.x>=this.x?1:-1;
      other.hit(22,kDir*340,-300);
      sparkBurst(tx,ty,14);
    }
  }

  hit(dmg,kbx,kby){
    if(this.invT>0)return;
    this.hp=Math.max(0,this.hp-dmg);
    this.vx+=kbx;this.vy+=kby;
    this.invT=550;this.flashT=400;
    burst(this.x,this.y-28,this.color,8,5);
    if(this.hp<=0)this.die(true);
  }

  die(wasHit){
    this.dead=true;this.deathT=0;
    if(wasHit)burst(this.x,this.y-28,this.color,20,8);
  }

  draw(){
    if(this.dead&&this.deathT>600)return;
    const alpha=this.dead?Math.max(0,1-(this.deathT-200)/450)
                        :(this.flashT>0&&Math.floor(this.flashT/55)%2===0?0.35:1);
    ctx.save();
    ctx.globalAlpha=alpha;

    const x=this.x,y=this.y,d=this.dir,c=this.color;
    const t=Date.now()*0.009;

    // Shadow
    ctx.fillStyle='rgba(0,0,0,.25)';
    ctx.beginPath();ctx.ellipse(x,y+2,18,5,0,0,Math.PI*2);ctx.fill();

    // --- LEGS ---
    ctx.strokeStyle=c;ctx.lineWidth=3.2;ctx.lineCap='round';ctx.lineJoin='round';
    const walking=Math.abs(this.vx)>5;
    ctx.beginPath();
    if(walking){
      ctx.moveTo(x,y-10);ctx.lineTo(x+Math.sin(t)*16-4,y+2);
      ctx.moveTo(x,y-10);ctx.lineTo(x-Math.sin(t)*16+4,y+2);
    } else {
      ctx.moveTo(x,y-10);ctx.lineTo(x-10,y+2);
      ctx.moveTo(x,y-10);ctx.lineTo(x+10,y+2);
    }
    ctx.stroke();

    // --- BODY ---
    ctx.beginPath();ctx.moveTo(x,y-34);ctx.lineTo(x,y-10);ctx.stroke();

    // --- NON-SWORD ARM ---
    const a2=this.atkTimer>0?(-0.6*d):(0.3*d);
    ctx.beginPath();ctx.moveTo(x,y-28);
    ctx.lineTo(x-d*16+Math.cos(a2)*8,y-18+Math.sin(a2)*6);
    ctx.stroke();

    // --- SWORD ARM ---
    const ang=this.swordAngle;
    const armL=17;
    const hx=x+d*5+Math.cos(ang)*armL;
    const hy=y-24+Math.sin(ang)*armL;
    ctx.beginPath();ctx.moveTo(x,y-28);ctx.lineTo(hx,hy);ctx.stroke();

    // --- SWORD ---
    const swL=46;
    const tx2=hx+Math.cos(ang)*swL,ty2=hy+Math.sin(ang)*swL;
    // guard
    const ga=ang+Math.PI/2;
    ctx.strokeStyle='#bbbbcc';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(hx+Math.cos(ga)*8,hy+Math.sin(ga)*8);
    ctx.lineTo(hx-Math.cos(ga)*8,hy-Math.sin(ga)*8);
    ctx.stroke();
    // blade
    const active=this.atkTimer>0&&!this.hitDone&&this.atkTimer<this.atkDur*.9;
    ctx.strokeStyle=active?'#ffffff':'#ccccdd';ctx.lineWidth=active?3.8:2.8;
    ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(tx2,ty2);ctx.stroke();
    // blade sheen
    ctx.strokeStyle='rgba(200,200,255,0.5)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(hx+1,hy);ctx.lineTo(tx2+1,ty2);ctx.stroke();
    if(active){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(tx2,ty2,3.5,0,Math.PI*2);ctx.fill();
    }

    // --- HEAD ---
    ctx.strokeStyle=c;ctx.lineWidth=3.2;
    ctx.beginPath();ctx.arc(x,y-46,12,0,Math.PI*2);ctx.stroke();
    // fill head slightly
    ctx.fillStyle=c+'22';ctx.fill();
    // eye
    ctx.fillStyle=c;
    ctx.beginPath();ctx.arc(x+d*5,y-48,2.8,0,Math.PI*2);ctx.fill();
    // mouth (small line)
    if(this.hp>50){
      // smile
      ctx.beginPath();ctx.arc(x+d*5,y-43,4,0,Math.PI);ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.stroke();
    } else {
      // frown
      ctx.beginPath();ctx.arc(x+d*5,y-40,4,Math.PI,0);ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.stroke();
    }

    ctx.restore();
  }
}

// ──────────────────────────────────────
// GAME STATE
// ──────────────────────────────────────
const p1=new Fighter(200,'#4499ff', 1,{left:'KeyA',right:'KeyD',jump:'KeyW',attack:'KeyF'},'P1 (WASD+F)');
const p2=new Fighter(700,'#ff4455',-1,{left:'ArrowLeft',right:'ArrowRight',jump:'ArrowUp',attack:'KeyL'},'P2 (←→↑L)');

const keys={};
document.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

let state='start'; // start | playing | roundOver | gameOver
let roundTimer=0,roundNum=1;
let roundWinner=null;
const WIN_ROUNDS=3;

// ──────────────────────────────────────
// DRAW HELPERS
// ──────────────────────────────────────
const STAR_CACHE=Array.from({length:25},()=>({x:Math.random()*W,y:Math.random()*260,r:.5+Math.random()*1.5,a:.3+Math.random()*.7}));

function drawBG(){
  // Sky
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0a0a1e');
  grad.addColorStop(1,'#151530');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  // Stars
  for(const s of STAR_CACHE){
    ctx.fillStyle=`rgba(255,255,255,${s.a})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
  // Moon
  ctx.fillStyle='rgba(255,255,220,0.7)';
  ctx.beginPath();ctx.arc(820,60,22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0c0c1e';ctx.beginPath();ctx.arc(830,55,17,0,Math.PI*2);ctx.fill();
}

function drawPlats(){
  for(const p of PLATS){
    // body
    const g=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
    g.addColorStop(0,'#2a2a50');g.addColorStop(1,'#1a1a38');
    ctx.fillStyle=g;ctx.fillRect(p.x,p.y,p.w,p.h);
    // top edge
    ctx.fillStyle='#5555aa';ctx.fillRect(p.x,p.y,p.w,3);
    // side shadow
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(p.x,p.y+3,3,p.h-3);
  }
}

function drawBar(x,y,w,h,ratio,label,col,wins,flip){
  ctx.fillStyle='#111';ctx.fillRect(x,y,w,h);
  const bw=w*ratio;
  // gradient fill
  const bg=ctx.createLinearGradient(x,0,x+bw,0);
  const base=ratio>0.5?'#22cc22':ratio>0.25?'#ccaa00':'#cc2222';
  bg.addColorStop(0,base);bg.addColorStop(1,col+'88');
  ctx.fillStyle=bg;ctx.fillRect(x,y,bw,h);
  // border
  ctx.strokeStyle='#444';ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h);
  // HP text
  ctx.fillStyle='#fff';ctx.font='bold 12px monospace';
  ctx.textAlign=flip?'right':'left';
  ctx.fillText(label,flip?x+w-6:x+6,y+h-5);
  // wins
  ctx.fillStyle=col;ctx.font='bold 14px monospace';
  ctx.textAlign=flip?'right':'left';
  ctx.fillText('★'.repeat(wins),flip?x+w-6:x+6,y+h+16);
}

function drawUI(){
  const bw=280,bh=24;
  drawBar(16,14,bw,bh,p1.hp/p1.maxHp,`P1 ♥${p1.hp}  WASD+F`,p1.color,p1.wins,false);
  drawBar(W-16-bw,14,bw,bh,p2.hp/p2.maxHp,`←→↑L  ♥${p2.hp} P2`,p2.color,p2.wins,true);

  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.font='15px monospace';ctx.textAlign='center';
  ctx.fillText(`Runde ${roundNum}  ·  Erst zu ${WIN_ROUNDS}`,W/2,26);
}

function drawOverlay(line1,line2,col,line3){
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=col;ctx.font='bold 52px monospace';ctx.textAlign='center';
  ctx.fillText(line1,W/2,H/2-30);
  if(line2){ctx.fillStyle='#ccc';ctx.font='24px monospace';ctx.fillText(line2,W/2,H/2+20);}
  if(line3){ctx.fillStyle='#888';ctx.font='17px monospace';ctx.fillText(line3,W/2,H/2+58);}
}

// ──────────────────────────────────────
// ROUND MANAGEMENT
// ──────────────────────────────────────
function startRound(){
  p1.reset();p2.reset();
  ptcls.length=0;
  state='playing';
}

// ──────────────────────────────────────
// MAIN LOOP
// ──────────────────────────────────────
let lastTs=0;
function frame(ts){
  const dt=Math.min((ts-lastTs)/1000,.04);lastTs=ts;

  drawBG();drawPlats();

  // Update particles
  for(let i=ptcls.length-1;i>=0;i--){
    const p=ptcls[i];
    p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;
    p.vy+=.18;p.life-=p.decay;
    if(p.life<=0)ptcls.splice(i,1);
  }
  // Draw particles
  for(const p of ptcls){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
  }
  ctx.globalAlpha=1;

  if(state==='start'){
    p1.draw();p2.draw();
    drawUI();
    drawOverlay('STICKMAN FIGHT','Drücke ENTER oder F um zu starten','#fff',null);
    if(keys['Enter']||keys['KeyF']||keys['KeyL']){state='playing';}
  } else if(state==='playing'){
    p1.update(dt,keys);p2.update(dt,keys);
    p1.tryHit(p2);p2.tryHit(p1);
    p2.draw();p1.draw();
    drawUI();
    if(p1.dead||p2.dead){
      roundWinner=p1.dead&&!p2.dead?p2:(!p1.dead&&p2.dead?p1:null);
      if(roundWinner)roundWinner.wins++;
      state='roundOver';roundTimer=0;
    }
  } else if(state==='roundOver'){
    p1.update(dt,keys);p2.update(dt,keys);
    p2.draw();p1.draw();
    drawUI();
    roundTimer+=dt;
    const msg=roundWinner?`${roundWinner.label} gewinnt!`:'Unentschieden!';
    const col=roundWinner?roundWinner.color:'#fff';
    if(roundTimer<2.5){
      drawOverlay(msg,'','',null);
      ctx.fillStyle=col;ctx.font='bold 44px monospace';ctx.textAlign='center';
      ctx.fillText(msg,W/2,H/2-20);
    } else {
      if(p1.wins>=WIN_ROUNDS||p2.wins>=WIN_ROUNDS){
        state='gameOver';
      } else {
        roundNum++;
        startRound();
      }
    }
  } else if(state==='gameOver'){
    p2.draw();p1.draw();drawUI();
    const gw=p1.wins>=WIN_ROUNDS?p1:p2;
    drawOverlay(`${gw.label} SIEGT!`,`${p1.wins} – ${p2.wins}`,gw.color,'R = Neustart');
    if(keys['KeyR']){p1.wins=0;p2.wins=0;roundNum=1;startRound();}
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
